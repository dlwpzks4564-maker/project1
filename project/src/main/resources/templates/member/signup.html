<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="mb-4">
                        회원가입
                    </h2>
                    <div class="alert alert-danger"
                         th:if="${error}"
                         th:text="${error}">
                    </div>
                    <form action="/member/signup"
                          method="post">
                        <div class="mb-3">
                            <label class="form-label">
                                아이디
                            </label>
                            <input type="text"
                                   name="loginId"
                                   class="form-control"
                                   maxlength="50"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                비밀번호
                            </label>
                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   maxlength="100"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                이름
                            </label>
                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   maxlength="50"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                이메일
                            </label>
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   maxlength="100"
                                   required>
                        </div>
                        <input type="hidden"
                               name="termsAgreed"
                               value="true">
                        <input type="hidden"
                               name="privacyAgreed"
                               value="true">
                        <div class="d-flex justify-content-between mt-4">
                            <a href="/member/terms"
                               class="btn btn-secondary">
                                이전
                            </a>
                            <button type="submit"
                                    class="btn btn-primary">
                                회원가입
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
