<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>회원 관리</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            회원 관리
        </h2>
        <span class="badge bg-dark"
              th:text="'전체 ' + ${members.size()} + '명'}">
        </span>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>아이디</th>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>권한</th>
                        <th>상태</th>
                        <th>가입일</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="member : ${members}">
                        <td th:text="${member.id}"></td>
                        <td th:text="${member.loginId}"></td>
                        <td th:text="${member.name}"></td>
                        <td th:text="${member.email}"></td>
                        <td>
                            <span class="badge bg-danger"
                                  th:if="${member.role.name() == 'ADMIN'}">
                                ADMIN
                            </span>
                            <span class="badge bg-primary"
                                  th:if="${member.role.name() == 'USER'}">
                                USER
                            </span>
                        </td>
                        <td>
                            <span class="badge bg-success"
                                  th:if="${member.status.name() == 'ACTIVE'}">
                                ACTIVE
                            </span>
                            <span class="badge bg-secondary"
                                  th:if="${member.status.name() == 'INACTIVE'}">
                                INACTIVE
                            </span>
                            <span class="badge bg-danger"
                                  th:if="${member.status.name() == 'KICKED'}">
                                KICKED
                            </span>
                        </td>
                        <td th:text="${member.createdAt}"></td>
                        <td>
                            <a th:href="@{/admin/members/{id}(id=${member.id})}"
                               class="btn btn-sm btn-outline-primary">
                                상세
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${members.isEmpty()}">
                        <td colspan="8"
                            class="text-center py-5">
                            등록된 회원이 없습니다.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
